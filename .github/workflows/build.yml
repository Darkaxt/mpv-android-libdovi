name: Build ARM64 AAR

on:
  push:
    branches: [libdovi]
  pull_request:
  workflow_dispatch:

jobs:
  aar:
    runs-on: ubuntu-24.04
    env:
      cores: '2'
      CARGO_BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Read cache identifier
        run: buildscripts/include/ci.sh export >> "$GITHUB_ENV"

      - uses: actions/cache@v5
        with:
          path: gh-cache/
          key: ${{ env.CACHE_IDENTIFIER }}

      - name: Install pinned host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes autoconf gperf libssl-dev libtool ninja-build pkgconf python3-pip
          source buildscripts/include/depinfo.sh
          rustup toolchain install "$v_rust" --profile minimal --no-self-update
          rustup default "$v_rust"
          cargo install cargo-c --version "$v_cargo_c" --locked
          python3 -m pip install --user --break-system-packages "meson==$v_meson"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download or build native dependencies
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install
        env:
          CACHE_MODE: folder
          CACHE_FOLDER: ${{ github.workspace }}/gh-cache

      - name: Build and compile-check AAR
        run: buildscripts/include/ci.sh build

      - name: Inspect artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 buildscripts/include/inspect-aar.py lib/build/outputs/aar/lib-release.aar \
            --extract-dir aar-inspect > dist/native-manifest.json
          cp lib/build/outputs/aar/lib-release.aar dist/mpv-android-libdovi-arm64.aar
          cp buildscripts/include/depinfo.sh dist/native-pins.sh
          cd dist
          sha256sum mpv-android-libdovi-arm64.aar > SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: mpv-android-libdovi-arm64
          path: dist/*
          if-no-files-found: error
