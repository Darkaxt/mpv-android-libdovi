name: Build ARM64 AAR

on:
  push:
    branches: [libdovi]
  pull_request:
  workflow_dispatch:

jobs:
  aar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Read cache identifier
        run: buildscripts/include/ci.sh export >> "$GITHUB_ENV"

      - uses: actions/cache@v5
        with:
          path: gh-cache/
          key: ${{ env.CACHE_IDENTIFIER }}

      - name: Install pinned host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes autoconf gperf libssl-dev libtool ninja-build pkgconf python3-pip
          source buildscripts/include/depinfo.sh
          rustup toolchain install "$v_rust" --profile minimal --no-self-update
          rustup default "$v_rust"
          cargo install cargo-c --version "$v_cargo_c" --locked
          python3 -m pip install --user --break-system-packages "meson==$v_meson"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download or build native dependencies
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install
        env:
          CACHE_MODE: folder
          CACHE_FOLDER: ${{ github.workspace }}/gh-cache

      - name: Build and compile-check AAR
        run: buildscripts/include/ci.sh build

      - name: Inspect artifact
        shell: bash
        run: |
          set -euo pipefail
          aar=lib/build/outputs/aar/lib-release.aar
          unzip -q "$aar" -d aar-inspect
          for entry in \
            classes.jar \
            jni/arm64-v8a/libplayer.so \
            jni/arm64-v8a/libmpv.so \
            jni/arm64-v8a/libavcodec.so \
            jni/arm64-v8a/libavdevice.so \
            jni/arm64-v8a/libavfilter.so \
            jni/arm64-v8a/libavformat.so \
            jni/arm64-v8a/libavutil.so \
            jni/arm64-v8a/libswresample.so \
            jni/arm64-v8a/libswscale.so \
            jni/arm64-v8a/libc++_shared.so; do
            test -f "aar-inspect/$entry"
          done
          jar tf aar-inspect/classes.jar | grep -qx 'is/xyz/mpv/MPV.class'
          jar tf aar-inspect/classes.jar | grep -qx 'is/xyz/mpv/MPVNode.class'
          jar tf aar-inspect/classes.jar | grep -qx 'is/xyz/mpv/BaseMPVView.class'
          readelf -h aar-inspect/jni/arm64-v8a/libmpv.so | grep -q 'Machine:.*AArch64'
          strings aar-inspect/jni/arm64-v8a/libmpv.so | grep -qx 'dovi_parse_rpu'
          mkdir -p dist
          cp "$aar" dist/mpv-android-libdovi-arm64.aar

      - uses: actions/upload-artifact@v7
        with:
          name: mpv-android-libdovi-arm64
          path: dist/mpv-android-libdovi-arm64.aar
          if-no-files-found: error
